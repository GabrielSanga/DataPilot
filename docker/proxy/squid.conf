# Proxy do ambiente dos agentes: unico caminho do container para fora. Libera so a lista abaixo.
# Depois de mudar este arquivo: docker compose restart proxy
# Para ver o que foi recusado (TCP_DENIED): docker compose exec proxy tail -f /var/log/squid/access.log
http_port 3128

# "-n" compara so o nome pedido, sem consulta de DNS reverso para pedidos feitos por endereco IP.
# Claude Code: API, login e telemetria essencial.
acl liberados dstdomain -n api.anthropic.com console.anthropic.com platform.claude.com claude.ai statsig.anthropic.com
# Codex: API e login.
acl liberados dstdomain -n api.openai.com auth.openai.com chatgpt.com ab.chatgpt.com

# TFS (exemplo, desligado). O proxy libera o host inteiro, com leitura e escrita: quem garante o
# "somente leitura" e o escopo do PAT usado dentro do container, e nao esta lista.
# Se o TFS usar outra porta, acrescente-a tambem em "portas_liberadas".
# acl liberados dstdomain -n tfs.suaempresa.local

acl portas_liberadas port 443

http_access deny !portas_liberadas
http_access allow liberados
http_access deny all

cache deny all
access_log daemon:/var/log/squid/access.log squid
